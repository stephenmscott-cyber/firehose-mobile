<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,
           initial-scale=1,
           maximum-scale=1,
           user-scalable=no,
           viewport-fit=cover">

<meta
  name="apple-mobile-web-app-capable"
  content="yes">

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default">

<meta
  name="theme-color"
  content="#ffffff">

<title>Firehose</title>


<style>

:root {
  --blue:#1769e0;
  --blue-soft:#eef5ff;
  --red:#d94444;
  --text:#17191c;
  --muted:#777c84;
  --line:#e7e9ed;
  --panel:#f7f8fa;
  --green:#168052;
}


* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body {
  margin:0;
  background:white;
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
}


body {
  min-height:100vh;
  min-height:100dvh;
}


button,
input,
textarea {
  font:inherit;
}


button {
  cursor:pointer;
}


.app {
  max-width:680px;
  margin:auto;

  padding:
    max(18px, env(safe-area-inset-top))
    17px
    calc(100px + env(safe-area-inset-bottom));
}


/* HEADER */

header {
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:24px;
}


.brand {
  font-weight:850;
  font-size:22px;
  letter-spacing:.08em;
}


.count {
  color:var(--muted);
  font-size:13px;
}


/* CAPTURE */

.capture-card {
  border:1px solid var(--line);
  border-radius:24px;

  padding:25px 18px 20px;

  background:white;

  box-shadow:
    0 8px 30px rgba(0,0,0,.035);
}


.capture-top {
  text-align:center;
}


.mic {
  width:116px;
  height:116px;

  border:0;
  border-radius:50%;

  background:var(--blue);
  color:white;

  font-size:44px;

  box-shadow:
    0 12px 32px rgba(23,105,224,.23);

  transition:
    transform .12s,
    background .2s;
}


.mic:active {
  transform:scale(.96);
}


.mic.recording {
  background:var(--red);
  animation:pulse 1.3s infinite;
}


@keyframes pulse {

  0% {
    box-shadow:
      0 0 0 0 rgba(217,68,68,.35);
  }

  70% {
    box-shadow:
      0 0 0 22px rgba(217,68,68,0);
  }

  100% {
    box-shadow:
      0 0 0 0 rgba(217,68,68,0);
  }

}


.capture-title {
  margin-top:15px;

  font-size:19px;
  font-weight:750;
}


.capture-help {
  margin-top:5px;

  color:var(--muted);
  font-size:14px;
}


.timer {
  display:none;

  margin-top:8px;

  color:var(--red);

  font-size:23px;
  font-weight:700;

  font-variant-numeric:tabular-nums;
}


/* AUDIO */

.audio-area {
  display:none;

  margin-top:20px;

  padding:14px;

  background:var(--panel);

  border-radius:14px;
}


.audio-label {
  font-size:12px;
  color:var(--muted);
  font-weight:700;

  margin-bottom:9px;

  text-transform:uppercase;
  letter-spacing:.06em;
}


audio {
  width:100%;
}


/* TEXT */

.composer {
  margin-top:20px;
}


textarea {
  width:100%;
  min-height:105px;

  resize:none;

  border:1px solid var(--line);
  border-radius:15px;

  padding:14px;

  outline:none;

  color:var(--text);
  background:white;

  font-size:16px;
  line-height:1.45;
}


textarea:focus {
  border-color:#aac9f7;
  box-shadow:
    0 0 0 3px rgba(23,105,224,.08);
}


.tags-input {
  width:100%;

  margin-top:10px;

  border:1px solid var(--line);
  border-radius:13px;

  padding:12px 13px;

  outline:none;
}


.save-row {
  display:flex;
  align-items:center;
  gap:10px;

  margin-top:12px;
}


.save {
  flex:1;

  border:0;
  border-radius:13px;

  background:var(--blue);
  color:white;

  padding:13px;

  font-weight:750;
}


.save:disabled {
  opacity:.45;
}


.clear {
  border:1px solid var(--line);
  background:white;

  border-radius:13px;

  padding:12px 15px;
}


/* STATUS */

.status {
  min-height:20px;

  margin-top:11px;

  text-align:center;

  font-size:13px;
  color:var(--muted);
}


.status.success {
  color:var(--green);
}


.status.error {
  color:var(--red);
}


/* BROWSE */

.library {
  margin-top:31px;
}


.section-header {
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;
}


.section-title {
  font-size:18px;
  font-weight:800;
}


.refresh {
  border:0;
  background:transparent;

  color:var(--blue);

  font-size:14px;
  font-weight:650;
}


/* SEARCH */

.search {
  width:100%;

  border:1px solid var(--line);
  border-radius:14px;

  padding:12px 14px;

  outline:none;

  background:var(--panel);
}


.filters {
  display:flex;
  gap:7px;

  overflow-x:auto;

  padding:11px 0 15px;

  scrollbar-width:none;
}


.filters::-webkit-scrollbar {
  display:none;
}


.filter {
  white-space:nowrap;

  border:1px solid var(--line);
  border-radius:999px;

  background:white;

  padding:8px 12px;

  font-size:13px;
}


.filter.active {
  background:var(--text);
  border-color:var(--text);
  color:white;
}


/* ITEMS */

.items {
  display:flex;
  flex-direction:column;
}


.item {
  padding:16px 2px;

  border-bottom:1px solid var(--line);
}


.item-content {
  font-size:15px;
  line-height:1.45;

  white-space:pre-wrap;
  word-break:break-word;
}


.item-meta {
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:7px;

  margin-top:9px;

  color:var(--muted);
  font-size:12px;
}


.source {
  text-transform:capitalize;
}


.tag {
  background:var(--blue-soft);
  color:#2861a8;

  border-radius:999px;

  padding:4px 7px;
}


.empty {
  padding:38px 10px;

  text-align:center;

  color:var(--muted);

  font-size:14px;
}


/* LOADING */

.loading {
  padding:25px;

  text-align:center;

  color:var(--muted);
}


/* ERROR BOX */

.error-box {
  display:none;

  margin-top:14px;

  padding:12px;

  background:#fff1f1;
  color:#9d2525;

  border:1px solid #ffd0d0;
  border-radius:12px;

  font-size:13px;

  word-break:break-word;
}

</style>

</head>


<body>

<div class="app">


<header>

  <div class="brand">
    FIREHOSE
  </div>

  <div
    id="count"
    class="count">
    —
  </div>

</header>



<section class="capture-card">


  <div class="capture-top">

    <button
      id="mic"
      class="mic"
      type="button">
      🎙️
    </button>


    <div
      id="captureTitle"
      class="capture-title">

      Capture a thought

    </div>


    <div
      id="captureHelp"
      class="capture-help">

      Speak it or type it

    </div>


    <div
      id="timer"
      class="timer">

      0:00

    </div>

  </div>


  <div
    id="errorBox"
    class="error-box">
  </div>


  <div
    id="audioArea"
    class="audio-area">

    <div class="audio-label">
      Voice capture
    </div>

    <audio
      id="audio"
      controls
      playsinline>
    </audio>

  </div>



  <div class="composer">

    <textarea
      id="thought"
      placeholder="What's on your mind?"></textarea>


    <input
      id="tags"
      class="tags-input"
      type="text"
      autocomplete="off"
      autocapitalize="none"
      placeholder="Tags — comma separated">


    <div class="save-row">

      <button
        id="save"
        class="save"
        type="button">

        Save thought

      </button>


      <button
        id="clear"
        class="clear"
        type="button">

        Clear

      </button>

    </div>


    <div
      id="status"
      class="status">
    </div>

  </div>


</section>



<section class="library">


  <div class="section-header">

    <div class="section-title">
      Recent
    </div>


    <button
      id="refresh"
      class="refresh"
      type="button">

      Refresh

    </button>

  </div>


  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search Firehose">


  <div class="filters">

    <button
      class="filter active"
      data-filter="all">

      All

    </button>


    <button
      class="filter"
      data-filter="thought">

      Thoughts

    </button>


    <button
      class="filter"
      data-filter="voice">

      Voice

    </button>

  </div>


  <div
    id="items"
    class="items">

    <div class="loading">
      Loading Firehose…
    </div>

  </div>


</section>


</div>



<script>

/* =====================================================
   FIREHOSE CONFIGURATION
===================================================== */


const FIREHOSE_API_URL =
  "https://script.google.com/macros/s/AKfycbyMTKd-KLTLupPA-IAZFPSRl86kbE4YlxoxC9NS25DX8sBf-uxW-oJYyZVPTXPgonDg/exec";


/* =====================================================
   STATE
===================================================== */


let items = [];

let activeFilter = "all";

let mediaRecorder = null;

let mediaStream = null;

let audioChunks = [];

let audioURL = null;

let recording = false;

let voiceCaptured = false;

let timerInterval = null;

let startedAt = null;


/* =====================================================
   ELEMENTS
===================================================== */


const mic =
  document.getElementById("mic");

const thought =
  document.getElementById("thought");

const tags =
  document.getElementById("tags");

const save =
  document.getElementById("save");

const clear =
  document.getElementById("clear");

const status =
  document.getElementById("status");

const itemsEl =
  document.getElementById("items");

const count =
  document.getElementById("count");

const search =
  document.getElementById("search");

const refresh =
  document.getElementById("refresh");

const timer =
  document.getElementById("timer");

const captureTitle =
  document.getElementById("captureTitle");

const captureHelp =
  document.getElementById("captureHelp");

const audioArea =
  document.getElementById("audioArea");

const audio =
  document.getElementById("audio");

const errorBox =
  document.getElementById("errorBox");


/* =====================================================
   LOAD ITEMS
===================================================== */


async function loadItems() {

  itemsEl.innerHTML =
    '<div class="loading">Loading Firehose…</div>';


  try {

    const response =
      await fetch(
        FIREHOSE_API_URL +
        "?action=getItems&t=" +
        Date.now()
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const data =
      await response.json();


    if (!data.ok) {
      throw new Error(
        data.error ||
        "Could not load items"
      );
    }


    items =
      Array.isArray(data.items)
        ? data.items
        : [];


    renderItems();

  }

  catch (error) {

    console.error(error);


    itemsEl.innerHTML =

      '<div class="empty">' +
      'Could not load Firehose.<br>' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* =====================================================
   CREATE ITEM
===================================================== */


async function createItem() {

  const content =
    thought.value.trim();


  if (!content) {

    setStatus(
      "Enter a thought before saving.",
      "error"
    );

    thought.focus();

    return;

  }


  save.disabled =
    true;


  setStatus(
    "Saving…"
  );


  const item = {

    id:
      createId(),

    type:
      "thought",

    content:
      content,

    created_at:
      new Date().toISOString(),

    source:
      voiceCaptured
        ? "voice"
        : "mobile",

    tags:
      parseTags(
        tags.value
      )

  };


  try {

    const response =
      await fetch(
        FIREHOSE_API_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify({
              action:
                "createItem",
              item:
                item
            })

        }
      );


    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }


    const result =
      await response.json();


    if (!result.ok) {
      throw new Error(
        result.error ||
        "Save failed"
      );
    }


    /*
     * Optimistic local display.
     * Sheet remains source of truth.
     */

    items.unshift(item);

    renderItems();


    resetComposer();


    setStatus(
      "Saved to Firehose ✓",
      "success"
    );


    setTimeout(
      () => {
        setStatus("");
      },
      1800
    );

  }

  catch (error) {

    console.error(error);


    setStatus(
      "Save failed: " +
      error.message,
      "error"
    );

  }

  finally {

    save.disabled =
      false;

  }

}


/* =====================================================
   MICROPHONE
===================================================== */


async function startRecording() {

  hideError();


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      "Microphone capture isn't supported by this browser."
    );

    return;

  }


  if (
    typeof MediaRecorder ===
    "undefined"
  ) {

    showError(
      "Audio recording isn't supported by this browser."
    );

    return;

  }


  try {

    mediaStream =

      await navigator.mediaDevices
        .getUserMedia({
          audio:true,
          video:false
        });


    audioChunks =
      [];


    mediaRecorder =
      new MediaRecorder(
        mediaStream
      );


    mediaRecorder.ondataavailable =
      event => {

        if (
          event.data &&
          event.data.size
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      finishRecording;


    mediaRecorder.onerror =
      event => {

        showError(
          event.error
            ? event.error.message
            : "Recording error"
        );

      };


    mediaRecorder.start();


    recording =
      true;


    voiceCaptured =
      true;


    mic.classList.add(
      "recording"
    );


    mic.textContent =
      "■";


    captureTitle.textContent =
      "Recording";


    captureHelp.textContent =
      "Tap the red button when finished";


    startTimer();

  }

  catch (error) {

    showError(
      error.name +
      ": " +
      error.message
    );

  }

}


function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ) {

    mediaRecorder.stop();

  }


  recording =
    false;


  mic.classList.remove(
    "recording"
  );


  mic.textContent =
    "🎙️";


  stopTimer();

}


function finishRecording() {

  const mimeType =

    mediaRecorder.mimeType

    ||

    (
      audioChunks[0]
        ? audioChunks[0].type
        : "audio/mp4"
    );


  const blob =

    new Blob(
      audioChunks,
      {
        type:mimeType
      }
    );


  if (audioURL) {

    URL.revokeObjectURL(
      audioURL
    );

  }


  audioURL =
    URL.createObjectURL(
      blob
    );


  audio.src =
    audioURL;


  audioArea.style.display =
    "block";


  captureTitle.textContent =
    "Voice captured";


  captureHelp.textContent =
    "Add the thought text below, then save";


  if (mediaStream) {

    mediaStream
      .getTracks()
      .forEach(
        track =>
          track.stop()
      );

  }


  mediaStream =
    null;


  thought.focus();

}


/* =====================================================
   TIMER
===================================================== */


function startTimer() {

  startedAt =
    Date.now();


  timer.style.display =
    "block";


  timer.textContent =
    "0:00";


  timerInterval =
    setInterval(
      updateTimer,
      250
    );

}


function updateTimer() {

  const seconds =
    Math.floor(
      (
        Date.now() -
        startedAt
      ) / 1000
    );


  const minutes =
    Math.floor(
      seconds / 60
    );


  timer.textContent =

    minutes +
    ":" +
    String(
      seconds % 60
    ).padStart(
      2,
      "0"
    );

}


function stopTimer() {

  clearInterval(
    timerInterval
  );


  timerInterval =
    null;

}


/* =====================================================
   RENDER
===================================================== */


function renderItems() {

  const query =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    items.filter(
      item => {

        if (
          activeFilter ===
          "thought"
          &&
          item.type !==
          "thought"
        ) {
          return false;
        }


        if (
          activeFilter ===
          "voice"
          &&
          item.source !==
          "voice"
        ) {
          return false;
        }


        if (query) {

          const haystack =

            [
              item.content,
              ...(item.tags || [])
            ]
              .join(" ")
              .toLowerCase();


          if (
            !haystack.includes(
              query
            )
          ) {
            return false;
          }

        }


        return true;

      }
    );


  count.textContent =
    items.length +
    (
      items.length === 1
        ? " item"
        : " items"
    );


  if (!filtered.length) {

    itemsEl.innerHTML =

      '<div class="empty">' +
      (
        items.length
          ? "Nothing matches this view."
          : "Nothing in Firehose yet."
      ) +
      '</div>';

    return;

  }


  itemsEl.innerHTML =

    filtered
      .map(
        item =>
          renderItem(item)
      )
      .join("");

}


function renderItem(item) {

  const tagHtml =

    (item.tags || [])
      .map(
        tag =>
          '<span class="tag">' +
          escapeHtml(tag) +
          '</span>'
      )
      .join("");


  return `

    <article class="item">

      <div class="item-content">
        ${escapeHtml(item.content)}
      </div>

      <div class="item-meta">

        <span class="source">
          ${escapeHtml(item.source || "mobile")}
        </span>

        <span>
          ${formatDate(item.created_at)}
        </span>

        ${tagHtml}

      </div>

    </article>

  `;

}


/* =====================================================
   RESET
===================================================== */


function resetComposer() {

  thought.value =
    "";

  tags.value =
    "";

  voiceCaptured =
    false;


  audioArea.style.display =
    "none";


  audio.removeAttribute(
    "src"
  );


  if (audioURL) {

    URL.revokeObjectURL(
      audioURL
    );

    audioURL =
      null;

  }


  timer.style.display =
    "none";


  captureTitle.textContent =
    "Capture a thought";


  captureHelp.textContent =
    "Speak it or type it";

}


/* =====================================================
   UTILITIES
===================================================== */


function parseTags(value) {

  return [
    ...new Set(

      value
        .split(",")
        .map(
          tag =>
            tag
              .trim()
              .toLowerCase()
        )
        .filter(Boolean)

    )
  ];

}


function createId() {

  if (
    crypto &&
    crypto.randomUUID
  ) {

    return crypto.randomUUID();

  }


  return (

    Date.now()
      .toString(36)

    +

    Math.random()
      .toString(36)
      .slice(2)

  );

}


function formatDate(value) {

  if (!value) {
    return "";
  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return value;

  }


  return date.toLocaleString(
    [],
    {
      month:"short",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit"
    }
  );

}


function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function setStatus(
  message,
  type=""
) {

  status.textContent =
    message;


  status.className =
    "status" +
    (
      type
        ? " " + type
        : ""
    );

}


function showError(message) {

  errorBox.style.display =
    "block";

  errorBox.textContent =
    message;


  captureTitle.textContent =
    "Microphone error";

  captureHelp.textContent =
    "Firehose couldn't start recording.";

}


function hideError() {

  errorBox.style.display =
    "none";

  errorBox.textContent =
    "";

}


/* =====================================================
   EVENTS
===================================================== */


mic.addEventListener(
  "click",
  () => {

    if (recording) {
      stopRecording();
    }

    else {
      startRecording();
    }

  }
);


save.addEventListener(
  "click",
  createItem
);


clear.addEventListener(
  "click",
  () => {

    resetComposer();

    setStatus("");

    hideError();

  }
);


refresh.addEventListener(
  "click",
  loadItems
);


search.addEventListener(
  "input",
  renderItems
);


document
  .querySelectorAll(".filter")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".filter")
            .forEach(
              x =>
                x.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          activeFilter =
            button.dataset.filter;


          renderItems();

        }
      );

    }
  );


/* =====================================================
   START
===================================================== */


loadItems();

</script>

</body>

</html>
